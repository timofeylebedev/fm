# nginx for flowmedium.pro: put the contents of dist/ (after `npm run build`) into /var/www/flowmedium and include this
# server block (for example as /etc/nginx/sites-available/flowmedium, linked into sites-enabled), then `nginx -t && nginx -s reload`.
# Certificates: certbot (Let's Encrypt) fills in the two ssl_certificate lines.

server {
  listen 80;
  listen [::]:80;
  server_name flowmedium.pro www.flowmedium.pro;
  return 301 https://flowmedium.pro$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.flowmedium.pro;
  ssl_certificate     /etc/letsencrypt/live/flowmedium.pro/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/flowmedium.pro/privkey.pem;
  return 301 https://flowmedium.pro$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name flowmedium.pro;
  ssl_certificate     /etc/letsencrypt/live/flowmedium.pro/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/flowmedium.pro/privkey.pem;

  root /var/www/flowmedium;
  index index.html;
  error_page 404 /404.html;
  charset utf-8;

  # compression: brotli if the module is installed (ngx_brotli), gzip always
  # brotli_static on;
  # brotli_types text/css text/javascript application/javascript image/svg+xml application/json application/manifest+json;
  gzip on;
  gzip_static on;                 # the build leaves a ready .gz (and .br) next to every text file
  gzip_comp_level 6;
  gzip_vary on;
  gzip_types text/css text/javascript application/javascript image/svg+xml application/json application/manifest+json application/xml;

  # security headers (the page itself carries its Content Security Policy; frame-ancestors can only come from here)
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Content-Security-Policy "frame-ancestors 'self'" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # files whose name carries a hash of their content: cached for a year, never asked for again
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  # fonts may be asked for with CORS (crossorigin preload)
  location ~* \.woff2$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }
  # the pages and the files with a fixed name: checked with the server every time (they are small and change with a release)
  location / {
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    try_files $uri $uri/ $uri.html =404;
  }
  # the old address of the privacy policy on Taptop, if it moves here: location = /privacy_policy_ru { … }
}
