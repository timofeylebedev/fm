# Builds the site and publishes it on GitHub Pages, from the gh-pages branch.
# - A push to main publishes the site itself at the root: https://timofeylebedev.github.io/fm/
# - Every pull request is published as a preview in pr-preview/pr-<number>/
#   (https://timofeylebedev.github.io/fm/pr-preview/pr-<number>/). The link is posted as a comment on the
#   pull request, updated on every push, and the preview is removed when the pull request is merged or closed.
# Once: Settings → Pages → Build and deployment → Source: "Deploy from a branch", branch gh-pages, folder / (root).
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: write       # push to the gh-pages branch
  pull-requests: write  # the preview link comment

# One run at a time per pull request (by its number) or per branch, so a pull request never cancels a deploy of
# main. Not github.ref alone: when a pull request is merged, its "closed" run (the preview's removal) has the ref
# refs/heads/main, and it cancelled main's deploy that way (PR #59, Oct 25).
concurrency:
  group: pages-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm
      - if: github.event.action != 'closed'
        run: npm ci
      - if: github.event.action != 'closed'
        run: npm run build
      - if: github.event.action != 'closed'
        run: npm run check

      # GitHub Pages compresses by itself, so the .br/.gz copies are left out;
      # .nojekyll tells Pages to serve the files as they are.
      - name: Prepare for GitHub Pages
        if: github.event.action != 'closed'
        run: |
          find dist \( -name '*.br' -o -name '*.gz' \) -delete
          touch dist/.nojekyll

      # main → the root of the site; the open previews in pr-preview/ are kept
      - name: Publish the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false

      # pull request → its preview (and its removal when the pull request is closed)
      - name: Publish the preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
