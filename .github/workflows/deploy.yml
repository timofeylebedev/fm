# Builds the site and publishes it on GitHub Pages, from the gh-pages branch, with site-kit's workflows
# (https://github.com/timofeylebedev/site-kit, .github/workflows/site.yml and checks.yml; this file is its template).
# - A push to main publishes the site itself at the root: https://timofeylebedev.github.io/fm/
# - Every pull request is published as a preview in pr-preview/pr-<number>/
#   (https://timofeylebedev.github.io/fm/pr-preview/pr-<number>/). The link is posted as a comment on the
#   pull request, updated on every push, and the preview is removed when the pull request is merged or closed.
# - The review page of the system (`site-kit report`) is built from the code with the site and published at /report/
#   (a preview has its own at …/pr-<number>/report/).
# - Then the job `checks` measures the design system (site-kit checks, FM's settings in site-kit.config.mjs) and
#   publishes the review page again with the result; the record is kept on the report-data branch (main: history; a
#   pull request: its last run, compared with main; removed when the pull request is closed). On a pull request the
#   measuring runs only when a file of `checks.designPaths` changed, or with the label `checks`.
#   the label `shots`     → pictures of the pull request's changed blocks, in its preview's review page
#   Actions → Build and deploy → Run workflow → shots: all   → every block's pictures again (on main: kept)
#
# Once: Settings → Pages → Build and deployment → Source: "Deploy from a branch", branch gh-pages, folder / (root).
#       Settings → Actions → General → Workflow permissions: "Read and write permissions".
#       Issues → Labels: `checks` and `shots`.
# The kit's version is pinned here and in package.json ("site-kit"): raise both together, on purpose.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed, labeled]
  workflow_dispatch:
    inputs:
      shots:
        description: pictures of the blocks
        type: choice
        options: [changed, all, none]
        default: changed

# One run at a time per pull request (by its number) or per branch, so a pull request never cancels a deploy of
# main. Not github.ref alone: when a pull request is merged, its "closed" run (the preview's removal) has the ref
# refs/heads/main, and it cancelled main's deploy that way (PR #59, Oct 25). A label other than `checks`/`shots` gets
# a lane of its own (its run does nothing), so adding it never cancels a preview that is being published.
concurrency:
  group: pages-${{ github.event.action == 'labeled' && !contains(fromJSON('["checks", "shots"]'), github.event.label.name) && format('label-{0}', github.run_id) || github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  site:
    if: github.event.action != 'labeled' || contains(fromJSON('["checks", "shots"]'), github.event.label.name)
    permissions:
      contents: write       # push to the gh-pages branch
      pull-requests: write  # the preview link comment
    uses: timofeylebedev/site-kit/.github/workflows/site.yml@v0.1.0
    with:
      build: npm run build
      check: npm run check

  # They run after the site is out, so they never hold it up; a failure here never touches the site.
  # Measured in Chromium, then WebKit (the full sizes and the pages only).
  checks:
    needs: site
    permissions:
      contents: write       # the report-data branch, the review page on gh-pages
      pull-requests: write  # the preview
    uses: timofeylebedev/site-kit/.github/workflows/checks.yml@v0.1.0
    with:
      build: npm run build
      engines: chromium webkit:quick
      shots: ${{ inputs.shots || '' }}
