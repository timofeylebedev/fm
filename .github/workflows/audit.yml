# Checks every pull request in real browsers: `site-kit audit` (site-kit's .github/workflows/audit.yml; FM's settings
# in site-kit.config.mjs, key `audit`) loads the built page at nine screen sizes (phones, tablets, a phone turned
# sideways, laptops, a large screen, and a phone and a laptop with the browser's text made bigger) and fails on
# sideways scroll, cut-off text, text under 12px, tap targets under 24px, script errors and accessibility (axe-core)
# rules. Decided exceptions are in design/decisions.json (an exception with an `audit` field), each with its reason.
#
# Three engines: Chromium (Chrome, Edge, Yandex Browser, Android) fails its check when a problem is found. Firefox and
# WebKit (Safari, every browser on iPhone) run too, but only warn (their check stays green, the problems are in its
# summary): they were added without a first run to compare with. Once they have come back clean a few times, add them
# to `fail-on` below to make them fail too.
# To make a failing check stop a merge: Settings → Rules → Rulesets → New branch ruleset for main → Require status
# checks to pass → add "audit / audit (chromium)". Without that the check informs, but does not block.
# The kit's version is pinned here and in package.json ("site-kit"): raise both together, on purpose.
name: Responsive audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# one run per pull request (its ref is refs/pull/<n>/merge): a newer push cancels the older audit
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: timofeylebedev/site-kit/.github/workflows/audit.yml@v0.1.1
    with:
      build: npm run build
      engines: '["chromium", "firefox", "webkit"]'
      fail-on: '["chromium"]'
